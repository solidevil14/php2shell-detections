name: rules-regression

# The ruleset is proven on every push: synthetic byte-exact exploit traffic
# + a false-positive regression set + (optionally) the real php2shell CLI.
# A failure here means the rules or the toolkit behavior changed.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-suite:
    name: synthetic pcaps + benign regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: build suricata 7.0.10 from source (validated baseline)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential autoconf automake libtool \
            pkg-config libpcre2-dev libyaml-dev libpcap-dev libjansson-dev \
            libmagic-dev liblz4-dev libcap-ng-dev libevent-dev libmaxminddb-dev \
            cbindgen rustc cargo
          curl -sfL -o /tmp/suri.tar.gz https://www.openinfosecfoundation.org/download/suricata-7.0.10.tar.gz
          cd /tmp && tar xzf suri.tar.gz && cd suricata-7.0.10
          ./configure --prefix=/usr/local --disable-gccmarch-native > /dev/null
          make -j"$(nproc)" > /dev/null
          sudo make install-full > /dev/null
          sudo ldconfig
          /usr/local/bin/suricata --build-info | head -1

      - name: locate installed config
        run: |
          CONF=$(find /usr/local/etc /etc -name 'suricata.yaml' 2>/dev/null | head -1)
          echo "SURICATA_CONF=$CONF" >> "$GITHUB_ENV"
          echo "config: $CONF"

      - name: prepare upstream reference (pinned, read-only consumer)
        run: |
          git clone --depth 1 https://github.com/aarsaputra/php2shell.git /tmp/php2shell

      - name: install traffic-generator deps
        run: |
          python3 -m pip install --break-system-packages --user --quiet curl_cffi bcrypt || python3 -m pip install --user --quiet curl_cffi bcrypt

      - name: run regression suite
        env:
          P2S_REPO: /tmp/php2shell
          SURICATA_BIN: /usr/local/bin/suricata
        run: |
          python3 lab/test_matrix.py --skip-real

  real-tool-e2e:
    name: real php2shell CLI end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: build suricata 7.0.10 from source (validated baseline)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential autoconf automake libtool \
            pkg-config libpcre2-dev libyaml-dev libpcap-dev libjansson-dev \
            libmagic-dev liblz4-dev libcap-ng-dev libevent-dev libmaxminddb-dev \
            cbindgen rustc cargo
          curl -sfL -o /tmp/suri.tar.gz https://www.openinfosecfoundation.org/download/suricata-7.0.10.tar.gz
          cd /tmp && tar xzf suri.tar.gz && cd suricata-7.0.10
          ./configure --prefix=/usr/local --disable-gccmarch-native > /dev/null
          make -j"$(nproc)" > /dev/null
          sudo make install-full > /dev/null
          sudo ldconfig
          /usr/local/bin/suricata --build-info | head -1

      - name: locate installed config
        run: |
          CONF=$(find /usr/local/etc /etc -name 'suricata.yaml' 2>/dev/null | head -1)
          echo "SURICATA_CONF=$CONF" >> "$GITHUB_ENV"
          echo "config: $CONF"

      - name: prepare upstream + venv (tool runs for real)
        run: |
          git clone --depth 1 https://github.com/aarsaputra/php2shell.git /tmp/php2shell
          python3 -m venv /tmp/php2shell/.venv
          /tmp/php2shell/.venv/bin/pip install --quiet -r /tmp/php2shell/requirements.txt

      - name: run full suite (synthetic + benign + real-tool)
        env:
          P2S_REPO: /tmp/php2shell
          SURICATA_BIN: /usr/local/bin/suricata
        run: |
          python3 lab/test_matrix.py
